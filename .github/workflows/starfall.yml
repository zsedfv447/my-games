name: 遊戲合集 CI / 部署

on:
  push:
    branches: [main]
    paths: ['starfall-covenant/**', 'starlight-ro/**', 'index.html', '.github/workflows/starfall.yml']
  pull_request:
    paths: ['starfall-covenant/**', 'starlight-ro/**', 'index.html', '.github/workflows/starfall.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: starfall-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: starfall-covenant

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            starfall-covenant/package-lock.json
            starlight-ro/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/starfall-covenant/
      - name: 安裝星光冒險
        run: npm ci
        working-directory: starlight-ro
      - name: 驗證星光冒險
        run: npm test -- --maxWorkers=1 --no-file-parallelism
        working-directory: starlight-ro
      - name: 建置星光冒險
        run: npm run build
        working-directory: starlight-ro
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/starlight-ro/
      - name: 組合 Pages 內容
        if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p ../_site/starfall-covenant ../_site/starlight-ro
          cp -r dist/. ../_site/starfall-covenant/
          cp -r ../starlight-ro/dist/. ../_site/starlight-ro/
          cp ../index.html ../_site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: check
    # 在 repo 開啟 GitHub Pages 並設定變數 PAGES_ENABLED=true 後才部署
    if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
